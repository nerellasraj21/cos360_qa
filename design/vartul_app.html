<meta charset="utf-8"><title>Vartul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style id="css-clay">:root{
  --ink:#141413;
  --ink-2:#3D3D3A;
  --muted:#6B6A64;
  --line:#E8E6DC;
  --line-2:#F0EEE6;
  --bg:#F5F4EE;
  --surface:#FFFFFF;
  --deep:#141413;
  --deep-2:#1F1E1B;
  --brand:#B94E28;
  --brand-d:#8F3A1B;
  --brand-soft:#FBEBE3;
  --gold:#D97757;
  --gold-soft:#FBE6DA;
  --gold-ink:#8F3A1B;
  --ok:#1B7F46;
  --ok-soft:#E3F4EA;
  --warn:#8A4A12;
  --warn-soft:#FBE6DA;
  --bad:#B5301F;
  --bad-soft:#FCE9E6;
  --info:#1F5FA6;
  --info-soft:#E6F0FB;
  --r-sm:8px;--r-md:12px;--r-lg:18px;
  --f-display:'Bricolage Grotesque','Instrument Sans',sans-serif;
  --f-body:'Instrument Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f-body);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.015em;margin:0}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
a{color:var(--brand);font-weight:600}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-md);font:700 15px var(--f-body);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--line-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.lg{min-height:52px;padding:0 24px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700;line-height:1.4}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.mute{background:var(--line-2);color:var(--ink-2)}
.chip.brand{background:var(--brand-soft);color:var(--brand-d)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

.lbl{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;color:var(--ink)}
.lbl small{font-weight:500;color:var(--muted);font-size:13px}
.inp{border:1.5px solid #D6D3C6;border-radius:var(--r-md);padding:0 14px;min-height:46px;font:500 15px var(--f-body);color:var(--ink);background:#fff;width:100%}
.inp::placeholder{color:#8E8C84}
.inp:focus{border-color:var(--brand);outline:3px solid rgba(185,78,40,.18)}
.inp.err{border-color:var(--bad)}
.hint{font-size:13px;color:var(--muted);font-weight:500}
.hint.err{color:var(--bad);font-weight:600}

.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--brand-soft);color:var(--brand-d);font-weight:800;font-family:var(--f-display)}

.side{background:var(--deep);color:#E3DFD3}
.side .grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9A978C;font-weight:700;padding:20px 14px 6px}
.nav{position:relative;display:flex;align-items:center;gap:12px;padding:0 14px;min-height:42px;border-radius:10px;color:#E3DFD3;font-size:14.5px;font-weight:600;text-decoration:none}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:rgba(255,255,255,.12);color:#fff}
.nav.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.nav .count{margin-left:auto;background:var(--gold);color:var(--ink);border-radius:99px;font-size:12px;font-weight:800;padding:1px 8px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 32px;background:var(--surface);border-bottom:1px solid var(--line)}
.search{flex:1 1 320px;max-width:560px;display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid transparent;border-radius:var(--r-md);padding:0 14px;min-height:44px;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;font:500 15px var(--f-body);flex:1;min-width:0;color:var(--ink)}
.kbd{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:#fff;font-weight:600}

.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 16px;background:#FAF9F5;border-bottom:1px solid var(--line)}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line-2);font-size:14.5px;vertical-align:middle}
.tbl tr:hover td{background:#FBFAF6}
.tbl .r{text-align:right}

.seg{display:flex;gap:4px;background:var(--line-2);border-radius:var(--r-md);padding:4px}
.seg span{flex:1;text-align:center;padding:9px 8px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink-2);min-height:36px}
.seg span.on{background:#fff;color:var(--brand-d);box-shadow:0 1px 2px rgba(20,20,19,.14)}

.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);overflow:auto}
.tabs a{padding:12px 16px;font-weight:700;font-size:14.5px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs a.on{color:var(--brand-d);border-bottom-color:var(--brand)}

.mtab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;position:relative;min-height:56px}
.mtab.on{color:var(--brand-d)}
.mtab.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.sheet{background:var(--surface);border-top:1px solid var(--line)}

body{background:#EFEDE4}
.panel{background:#fff;border-radius:28px;box-shadow:0 1px 0 rgba(20,20,19,.04),0 18px 40px -22px rgba(20,20,19,.28)}
.panel.deep{background:var(--deep);color:#fff;box-shadow:none}
.hero{font-family:var(--f-display);font-weight:800;letter-spacing:-.035em;line-height:1}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.roombar{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:12px 28px;background:var(--deep);color:#fff}
.rooms{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:99px;padding:4px;flex-wrap:wrap}
.room{display:flex;align-items:center;gap:8px;padding:0 18px;min-height:40px;border-radius:99px;color:#E3DFD3;font-weight:700;font-size:14.5px;text-decoration:none}
.room:hover{background:rgba(255,255,255,.08)}
.room.on{background:#fff;color:var(--ink)}
.room.on::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.cmd{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 8px 0 16px;border-radius:99px;background:rgba(255,255,255,.1);color:#E3DFD3;font-weight:600;font-size:14.5px;min-width:300px}
.cmd .kbd{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:14px;color:var(--ink);text-decoration:none;white-space:nowrap}
.pill.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.slip{position:relative;background:#fff;padding:30px 26px 34px;font-variant-numeric:tabular-nums}
.slip::before,.slip::after{content:"";position:absolute;left:0;right:0;height:12px;background-image:radial-gradient(circle at 10px 0,#EFEDE4 6px,transparent 6.5px);background-size:20px 12px}
.slip::before{top:-1px}
.slip::after{bottom:-1px;transform:scaleY(-1)}
.dash{border-top:2px dashed #D6D3C6}
.slide{position:relative;display:flex;align-items:center;gap:12px;min-height:64px;border-radius:99px;background:var(--deep);color:#fff;padding:6px 22px 6px 6px;font-weight:700}
.slide .knob{width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.seat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 10px;border-radius:20px;background:#fff;border:1.5px solid var(--line);text-align:center;min-width:0}
.seat .face{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:17px;background:var(--brand-soft);color:var(--brand-d);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--brand)}
.seat.a .face{background:var(--bad-soft);color:var(--bad);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--bad)}
.seat.l .face{background:var(--gold-soft);color:var(--gold-ink);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gold)}
.seat.u .face{background:var(--line-2);color:var(--muted);box-shadow:0 0 0 3px #fff,0 0 0 5px #D6D3C6}
.seat .nm{font-weight:700;font-size:13.5px;line-height:1.2}
.seat .rl{font-size:12px;color:var(--muted);font-weight:600}
.dock{display:flex;align-items:center;justify-content:space-between;background:var(--deep);border-radius:99px;padding:8px 10px;margin:0 16px 14px}
.dock a{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#B0AEA5;text-decoration:none}
.dock a.on{background:rgba(255,255,255,.14);color:#fff}
.dock a.plus{width:56px;height:56px;background:var(--gold);color:var(--ink)}
.stamp{display:inline-block;border:3px solid var(--ok);color:var(--ok);border-radius:10px;padding:2px 12px;font-family:var(--f-display);font-weight:800;letter-spacing:.12em;transform:rotate(-8deg)}

html,body{height:100%}
body{background:var(--paper)}
#stage{min-height:100%;display:flex;justify-content:center}
#stage.phone{align-items:flex-start;padding:28px 12px 40px;background:var(--paper)}
#stage.phone #frame{width:390px;height:844px;border-radius:44px;border:10px solid #141413;overflow:hidden;box-shadow:0 30px 70px -30px rgba(0,0,0,.5);background:var(--bg);position:relative;flex:none}
#frame{width:100%;min-height:100%;position:relative}
#stage.phone #app{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
#app{min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tools .seg{padding:3px}
.tools .seg button{border:0;background:transparent;font:700 13px var(--f-body);padding:7px 12px;border-radius:9px;color:var(--ink-2);cursor:pointer;min-height:34px}
.tools .seg button.on{background:#fff;color:var(--brand-d);box-shadow:0 1px 2px rgba(20,20,19,.14)}
.roombar{position:sticky;top:0;z-index:20}
.roombar .rooms{overflow:auto;max-width:100%}
.workspace{display:grid;grid-template-columns:268px minmax(0,1fr);width:100%;max-width:1560px;margin:0 auto;flex:1}
.rail{padding:26px 16px 60px 24px;position:sticky;top:68px;align-self:start;max-height:calc(100vh - 68px);overflow:auto}
.rail .gt{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:18px 12px 6px}
.rail .gt:first-child{padding-top:0}
.rail a.sec{display:flex;align-items:center;gap:10px;padding:0 12px;min-height:40px;border-radius:12px;color:var(--ink-2);font-weight:600;font-size:14.5px;text-decoration:none;cursor:pointer}
.rail a.sec:hover{background:rgba(20,20,19,.05)}
.rail a.sec.on{background:var(--deep);color:#fff}
.rail a.sec .ct{margin-left:auto;font-size:12px;opacity:.7;font-weight:700}
.main{padding:28px 44px 90px;min-width:0;display:flex;flex-direction:column;gap:22px}
.crumbs{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.title{font-family:var(--f-display);font-weight:800;letter-spacing:-.035em;line-height:1.02;font-size:44px}
.sub{color:var(--ink-2);font-size:16px;margin-top:8px;max-width:760px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.m{display:inline-block;font:700 11.5px var(--f-body);padding:2px 8px;border-radius:7px;letter-spacing:.04em}
.m.GET{background:#E3EEFB;color:#1F5FA6}.m.POST{background:#E3F4EA;color:#1B7F46}.m.PUT,.m.PATCH{background:var(--gold-soft);color:var(--gold-ink)}.m.DELETE{background:var(--bad-soft);color:var(--bad)}
.tabbar{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1.5px solid var(--line);padding-bottom:0}
.tabbar button{border:0;background:transparent;font:700 14.5px var(--f-body);color:var(--muted);padding:12px 16px;border-bottom:3px solid transparent;margin-bottom:-1.5px;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:46px}
.tabbar button.on{color:var(--brand-d);border-bottom-color:var(--brand)}
.tabbar button .star{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tablewrap{overflow:auto;border-radius:0 0 28px 28px}
.tbl th .k{display:block;font:600 10.5px 'JetBrains Mono',ui-monospace,monospace;text-transform:none;letter-spacing:0;color:#9a978c;margin-top:2px}
.hidekeys .k{display:none!important}
.tbl td.mono{font-size:12.5px;color:var(--muted)}
.tbl tr.row{cursor:pointer}
.tbl tr.row.sel td{background:var(--brand-soft)}
.pager{display:flex;align-items:center;gap:12px;padding:14px 20px;flex-wrap:wrap;border-top:1px solid var(--line-2)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px}
.formgrid .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fld>label .req{color:var(--bad)}
.fld>label .k{font:600 11px 'JetBrains Mono',ui-monospace,monospace;color:#9a978c}
.fld .help{font-size:12.5px;color:var(--muted)}
.fld select.inp,.fld input.inp,.fld textarea.inp{width:100%}
.fld textarea.inp{min-height:92px;padding-top:12px;resize:vertical}
.sw{display:inline-flex;align-items:center;gap:12px;min-height:46px;font-weight:600}
.sw .track{width:46px;height:28px;border-radius:99px;background:#C9C6BA;position:relative;flex:none}
.sw .track::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on .track{background:var(--brand)}
.sw.on .track::after{left:21px}
.fs{border:1.5px dashed var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px}
.fs>.fh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fs>.fh b{font-family:var(--f-display);font-size:18px}
.rep{display:flex;flex-direction:column;gap:12px}
.repitem{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.drop{border:2px dashed #C9C6BA;border-radius:18px;padding:22px;text-align:center;color:var(--muted);font-weight:600;background:#fff}
.tagin{display:flex;gap:8px;flex-wrap:wrap;border:1.5px solid #D6D3C6;border-radius:12px;padding:8px;background:#fff;min-height:46px;align-items:center}
.tagin .chip{background:var(--brand-soft);color:var(--brand-d)}
.stepper{display:flex;gap:8px;flex-wrap:wrap}
.stepper .st{display:flex;align-items:center;gap:10px;padding:0 16px 0 6px;min-height:48px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:14px;cursor:pointer}
.stepper .st i{font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--line-2);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800}
.stepper .st.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.stepper .st.on i{background:var(--gold);color:var(--ink)}
.stepper .st.done i{background:var(--brand);color:#fff}
.sticky{position:sticky;bottom:0;display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 20px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 -10px 28px -16px rgba(20,20,19,.25)}
.apicard{display:flex;flex-direction:column;gap:12px;padding:18px 20px}
.apicard .path{font:600 13px 'JetBrains Mono',ui-monospace,monospace;word-break:break-all;color:var(--ink-2)}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.kv{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:10px 18px}
.kv dt{font-weight:700;color:var(--muted);font-size:13.5px}
.kv dd{margin:0;font-weight:600}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:40;box-shadow:-24px 0 60px -30px rgba(20,20,19,.5);display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.drawer .db{padding:22px;overflow:auto;display:flex;flex-direction:column;gap:18px}
#stage.phone .drawer{position:absolute;width:100%}
.scrim{position:fixed;inset:0;background:rgba(20,20,19,.45);z-index:30}
#stage.phone .scrim{position:absolute}
.dockbar{display:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:14px 22px;border-radius:99px;font-weight:700;z-index:60;box-shadow:0 20px 40px -20px rgba(0,0,0,.6)}
.matrix td,.matrix th{text-align:center;padding:10px 8px}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.cell{display:inline-flex;width:26px;height:26px;border-radius:8px;align-items:center;justify-content:center;background:var(--line-2);color:transparent}
.cell.y{background:var(--brand);color:#fff}
.ttgrid{display:grid;grid-template-columns:110px repeat(5,minmax(0,1fr));gap:8px;min-width:760px}
.ttgrid .th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:8px 4px}
.slot{border-radius:14px;padding:10px 12px;font-weight:700;font-size:13.5px;min-height:62px;background:#fff;border:1px solid var(--line)}
.slot small{display:block;font-weight:600;color:var(--muted);margin-top:2px}
.slot.brk{background:var(--line-2);color:var(--muted);text-align:center;display:flex;align-items:center;justify-content:center}
.slot.a{background:var(--brand-soft);border-color:transparent}
.slot.b{background:var(--gold-soft);border-color:transparent}
.slot.c{background:#E3EEFB;border-color:transparent}
.empty{padding:36px;text-align:center;color:var(--muted)}
.narrow .roombar{padding:10px 14px}
.narrow .roombar .cmd{display:none}
.narrow .workspace{grid-template-columns:minmax(0,1fr)}
.narrow .main{padding:16px 14px 110px;gap:18px}
.narrow .title{font-size:30px}
.narrow .formgrid,.narrow .cols2{grid-template-columns:minmax(0,1fr)}
.narrow .kv{grid-template-columns:minmax(0,1fr)}
.narrow .tabbar{flex-wrap:nowrap;overflow:auto}
.narrow .tabbar button{white-space:nowrap}
.narrow .dockbar{display:flex;position:sticky;bottom:0;z-index:25}
.narrow .dockbar{background:var(--deep);border-radius:99px;padding:6px;margin:0 12px 12px;justify-content:space-between;gap:2px;overflow:auto}
.narrow .dockbar a{flex:1;min-width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#B0AEA5;cursor:pointer;flex-direction:column;font-size:10px;font-weight:700;gap:2px}
.narrow .dockbar a.on{background:rgba(255,255,255,.14);color:#fff}
.narrow .sticky{position:static}

.cell.y{background:var(--brand);color:#fff}
.ttgrid{display:grid;grid-template-columns:110px repeat(5,minmax(0,1fr));gap:8px;min-width:760px}
.ttgrid .th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:8px 4px}
.slot{border-radius:14px;padding:10px 12px;font-weight:700;font-size:13.5px;min-height:62px;background:#fff;border:1px solid var(--line)}
.slot small{display:block;font-weight:600;color:var(--muted);margin-top:2px}
.slot.brk{background:var(--line-2);color:var(--muted);text-align:center;display:flex;align-items:center;justify-content:center}
.slot.a{background:var(--brand-soft);border-color:transparent}
.slot.b{background:var(--gold-soft);border-color:transparent}
.slot.c{background:#E3EEFB;border-color:transparent}
.empty{padding:36px;text-align:center;color:var(--muted)}
.narrow .roombar{padding:10px 14px}
.narrow .roombar .cmd{display:none}
.narrow .workspace{grid-template-columns:minmax(0,1fr)}
.narrow .main{padding:16px 14px 110px;gap:18px}
.narrow .title{font-size:30px}
.narrow .formgrid,.narrow .cols2{grid-template-columns:minmax(0,1fr)}
.narrow .kv{grid-template-columns:minmax(0,1fr)}
.narrow .tabbar{flex-wrap:nowrap;overflow:auto}
.narrow .tabbar button{white-space:nowrap}
.narrow .dockbar{display:flex;position:sticky;bottom:0;z-index:25}
.narrow .dockbar{background:var(--deep);border-radius:99px;padding:6px;margin:0 12px 12px;justify-content:space-between;gap:2px;overflow:auto}
.narrow .dockbar a{flex:1;min-width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#B0AEA5;cursor:pointer;flex-direction:column;font-size:10px;font-weight:700;gap:2px}
.narrow .dockbar a.on{background:rgba(255,255,255,.14);color:#fff}
.narrow .sticky{position:static}
.narrow [data-grid2]{grid-template-columns:minmax(0,1fr)!important}
.narrow .hero{font-size:34px}

.railhead{display:none}
.hamb{display:none!important}
.rail{padding:22px 14px 60px 20px}
.rail .mi{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 12px;border-radius:12px;color:var(--ink-2);font:600 14.5px var(--f-body);text-decoration:none;cursor:pointer;background:transparent;border:0;text-align:left}
.rail .mi:hover{background:rgba(20,20,19,.05)}
.rail .mi.top{font-weight:700;color:var(--ink)}
.rail .mi.top.has{color:var(--brand-d)}
.rail .mi .chev{margin-left:auto;display:flex;transition:transform .15s}
.rail .grp.open>.mi .chev{transform:rotate(90deg)}
.rail .kids{margin:2px 0 6px 21px;padding-left:10px;border-left:1.5px solid var(--line)}
.rail .kids[hidden]{display:none}
.rail .mi.l1,.rail .mi.l2{min-height:38px;font-size:14px}
.rail .grp.d1>.mi{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-height:34px}
.rail .grp.d1>.mi .chev{margin-left:8px}
.rail .mi.on{background:var(--deep);color:#fff}
.mscrim{display:none}
.narrow .hamb{display:inline-flex!important}
.narrow .rail{position:fixed;left:0;top:0;bottom:0;width:min(86%,320px);max-height:none;z-index:50;background:var(--bg);padding:14px;display:block;overflow:auto;transform:translateX(-102%);transition:transform .2s;box-shadow:24px 0 50px -30px rgba(0,0,0,.5)}
#stage.phone .rail{position:absolute}
.narrow .menuopen .rail{transform:none}
.narrow .railhead{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px}
.narrow .menuopen .mscrim{display:block;position:fixed;inset:0;background:rgba(20,20,19,.45);z-index:45}
#stage.phone .menuopen .mscrim{position:absolute}
.narrow .rail .mi{min-height:46px}
:root{--paper:#ECECF7}</style>

</style>
